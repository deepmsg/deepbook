name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.95.0"
          arguments: --all-features

  fix-conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: ./tests/fix_conformance/run.sh

  codecs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The versions here are the ones `gen-snapshot-sbe.sh` searches its
      # Gradle cache for, so the two ways of finding the generator cannot
      # disagree about which generator it is.
      - name: Fetch the pinned generator
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          curl -fsSLO https://repo1.maven.org/maven2/uk/co/real-logic/sbe-tool/1.42.0/sbe-tool-1.42.0.jar
          curl -fsSLO https://repo1.maven.org/maven2/org/agrona/agrona/2.7.1/agrona-2.7.1.jar
          echo "1bd907517ad63b09a63ad379e1bc4527ccac24abfd47ef2e0c5bc0cf0d1f16ab  sbe-tool-1.42.0.jar" | sha256sum -c -
          echo "f74421072629df93f3ac5148a4c41bb16a69e444a0ddca2b9f0c32919075bf5f  agrona-2.7.1.jar" | sha256sum -c -
      - name: Regenerate the snapshot codec
        env:
          SBE_TOOL_JAR: ${{ runner.temp }}/sbe-tool-1.42.0.jar
          AGRONA_JAR: ${{ runner.temp }}/agrona-2.7.1.jar
        run: ./scripts/gen-snapshot-sbe.sh
      # `--porcelain` rather than `git diff --exit-code`: the latter cannot see
      # an untracked file at all, and an untracked file is exactly what a new
      # schema message produces.
      - name: The tree is what schemas/ makes of it
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::regenerating the snapshot codec changed the tree; run \`just gen-snapshot\`"
            git status --porcelain
            git diff
            exit 1
          fi
