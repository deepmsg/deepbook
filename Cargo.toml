[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/fix",
    "crates/gateway",
    "crates/engine-core",
    "crates/engine-cluster",
    "crates/marketdata",
    "crates/admin",
    "crates/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/deepmsg/deepbook"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
