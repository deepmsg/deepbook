[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/codec/snapshot",
    "crates/fix",
    "crates/gateway",
    "crates/engine-core",
    "crates/engine-cluster",
    "crates/marketdata",
    "crates/admin",
    "crates/bench",
    "crates/io",
    "crates/spike",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/deepmsg/deepbook"

[workspace.dependencies]
# deepmsg is pinned by revision; see docs/deps.md. Never use a branch here.
deepmsg-client = { git = "https://github.com/deepmsg/deepmsg", rev = "3dc783d" }
deepmsg-codec = { git = "https://github.com/deepmsg/deepmsg", rev = "3dc783d" }
deepmsg-codec-cluster = { git = "https://github.com/deepmsg/deepmsg", rev = "3dc783d" }
deepmsg-core = { git = "https://github.com/deepmsg/deepmsg", rev = "3dc783d" }
deepmsg-cnc = { git = "https://github.com/deepmsg/deepmsg", rev = "3dc783d" }
deepmsg-cluster-client = { git = "https://github.com/deepmsg/deepmsg", rev = "3dc783d" }
deepmsg-cluster-common = { git = "https://github.com/deepmsg/deepmsg", rev = "3dc783d" }
deepmsg-cluster-service = { git = "https://github.com/deepmsg/deepmsg", rev = "3dc783d" }
deepmsg-driver = { git = "https://github.com/deepmsg/deepmsg", rev = "3dc783d" }
deepmsg-log = { git = "https://github.com/deepmsg/deepmsg", rev = "3dc783d" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
